<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">
        <!-- Додали клас calc-title, щоб JavaScript міг його знайти -->
        <h1 class="calc-title">Калькулятор</h1>
        <div class="calc-screen">0</div>


        <div class="calc-row">
            <button class="calc-button" id = "btnC">C</button>
            <button class="calc-button" id = "btn()">()</button>
            <button class="calc-button" id = "btn%">%</button>
            <button class="calc-button" id = "btn/">/</button>
        </div>

        <div class="calc-row">
            <button class="calc-button" id = "btn7">7</button>
            <button class="calc-button" id = "btn8">8</button>
            <button class="calc-button" id = "btn9">9</button>
            <button class="calc-button" id = "btn*">X</button>
        </div>

        <div class="calc-row">
            <button class="calc-button" id = "btn4">4</button>
            <button class="calc-button" id = "btn5">5</button>
            <button class="calc-button" id = "btn6">6</button>
            <button class="calc-button" id = "btn-">-</button>
        </div>

        <div class="calc-row">
            <button class="calc-button" id = "btn1">1</button>
            <button class="calc-button" id = "btn2">2</button>
            <button class="calc-button" id = "btn3">3</button>
            <button class="calc-button" id = "btn+">+</button>
        </div>

        <div class="calc-row">
            <button class="calc-button triple" id = "btn0">0</button>
            <button class="calc-button" id = "btndel">&larr;</button>
            <button class="calc-button" id = "btn=">&equals;</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
